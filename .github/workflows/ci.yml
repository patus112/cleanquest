name: CI
# Pull requests into main, including forks, get read-only checks only.
# Deployment stays in pages.yml: push to main or a manual run, and only when
# CLEANQUEST_DEPLOY_APPROVED is true. This workflow never requests Pages permissions.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cleanquest-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # OS libraries and the Chromium/WebKit builds for this Playwright release
    # live in the image, so the job does not apt-get from the Ubuntu mirror.
    # The tag matches @playwright/test in package-lock (1.64.0).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/cleanquest/' }}
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium webkit
      # Review screenshots are written here. The image does not ship this path.
      - run: mkdir -p /opt/cursor/artifacts
      - run: npm run e2e
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/cleanquest/' }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cleanquest-browser-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
