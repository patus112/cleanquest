name: CI
# Pull requests into main, including forks, get read-only checks only.
# Deployment stays in pages.yml: push to main or a manual run, and only when
# CLEANQUEST_DEPLOY_APPROVED is true. This workflow never requests Pages permissions.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cleanquest-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/cleanquest/' }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/cleanquest/' }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cleanquest-browser-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
